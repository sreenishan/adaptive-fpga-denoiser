# Denoising dataset — 4-level paired (noisy, clean) dataset.
# Separate from configs/dataset.yaml, which drives the 3-level classifier dataset.

image:
  width: 224
  height: 224
  grayscale: true

split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  seed: 42

# Noise levels are fixed at exactly the four target percentages.
# Salt-pepper: amount = fraction of pixels corrupted (0.05 = 5% of pixels).
# Gaussian:    sigma  = std dev in normalised [0,1] units (0.05 = 5% of full scale).
# Speckle:     variance = var of multiplicative term; std = sqrt(var), so
#              var=0.0025 -> std=0.05 -> 5% of local intensity.
noise:
  levels: [5, 10, 15, 20]    # percentage labels, for display only
  salt_pepper:
    amounts: [0.05, 0.10, 0.15, 0.20]
    salt_vs_pepper: 0.5
  gaussian:
    mean: 0.0
    sigmas: [0.05, 0.10, 0.15, 0.20]
  speckle:
    variances: [0.0025, 0.01, 0.0225, 0.04]

paths:
  raw_dir: data/raw
  dataset_dir: data/denoising
  manifest: data/denoising/manifest.csv
