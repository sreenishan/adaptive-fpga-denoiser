[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-fpga-denoising"
version = "0.1.0"
description = "Adaptive FPGA-based image noise detection and reduction system"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Core dependencies: everything needed to generate data, filter images and
# measure quality. The machine-learning framework is an extra on purpose, so
# `import denoising` works on a machine with no PyTorch installed.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest>=7.4"]
demo = ["streamlit>=1.30"]

[project.scripts]
denoising-check-config = "denoising.cli:main"
denoising-generate-dataset = "denoising.dataset.cli:main"
denoising-train = "denoising.model.train_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
# tests/rtl checks the SystemVerilog against the software reference via
# bit-accurate Python models. It runs in the normal suite on purpose: no
# simulator is installed, so this is the only automated check the RTL has.
testpaths = ["tests/python", "tests/rtl"]
# Lets `pytest` run in a fresh checkout without `pip install -e .` first.
pythonpath = ["src"]
addopts = "-ra"
